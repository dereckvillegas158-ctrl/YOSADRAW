# Compila YOSADRAW para Windows x64 (instalador NSIS + versión portable)
# en una máquina Windows de GitHub. Al subir una etiqueta v*, publica además
# la release con los .exe y el APK de Android firmado (de la rama `binarios`,
# porque la clave de firma no se sube a GitHub).
name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: YOSADRAW-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
      - name: APK firmado (rama binarios)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          git fetch --depth=1 origin binarios
          git show "FETCH_HEAD:YOSADRAW-$v.apk" > "release/YOSADRAW-$v.apk"
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          files=(release/YOSADRAW-Setup-$v-x64.exe release/YOSADRAW-$v-x64-portable.exe "release/YOSADRAW-$v.apk")
          # Si la release ya existe (creada desde la web de GitHub), sólo se le añaden los archivos.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "YOSADRAW $v" --notes-file RELEASE_NOTES.md; fi
